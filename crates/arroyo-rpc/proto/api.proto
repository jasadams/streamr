syntax = "proto3";

package api;

// Program

message PipelineProgramUdf {
  string name = 1;
  string definition = 2;
  string dependencies = 3;
}

message ConnectorOp {
  string connector = 1;
  string config = 2;
  string description = 3;
}

/// Deprecated -- use ProjectionOperator instead
message ValuePlanOperator {
  string name = 1;
  bytes physical_plan = 2;
}

/// Deprecated -- use ProjectionOperator instead
message KeyPlanOperator {
  string name = 1;
  bytes physical_plan = 2;
  repeated uint64 key_fields = 3;
}

message ProjectionOperator {
  string name = 1;
  ArroyoSchema input_schema = 2;
  ArroyoSchema output_schema = 3;
  repeated bytes exprs = 4;
}

message TumblingWindowAggregateOperator {
  string name = 1;
  uint64 width_micros = 2;
  bytes binning_function = 3;
  ArroyoSchema input_schema = 4;
  ArroyoSchema partial_schema = 5;
  bytes partial_aggregation_plan = 6;
  bytes final_aggregation_plan = 7;
  optional bytes final_projection = 8;
}

message SlidingWindowAggregateOperator {
  string name = 1;
  uint64 width_micros = 2;
  uint64 slide_micros = 3;
  bytes binning_function = 4;
  ArroyoSchema input_schema = 5;
  ArroyoSchema partial_schema = 6;
  bytes partial_aggregation_plan = 7;
  bytes final_aggregation_plan = 8;
  bytes final_projection = 9;
}

message SessionWindowAggregateOperator {
  string name = 1;
  uint64 gap_micros = 2;
  string window_field_name = 3;
  uint64 window_index = 4;
  ArroyoSchema input_schema = 5;
  ArroyoSchema unkeyed_aggregate_schema = 6;
  bytes partial_aggregation_plan = 7;
  bytes final_aggregation_plan = 8;
}

message JoinOperator {
  string name = 1;
  ArroyoSchema left_schema = 2;
  ArroyoSchema right_schema = 3;
  ArroyoSchema output_schema = 4;
  bytes join_plan = 5;
  optional uint64 ttl_micros = 6;
}

message LookupJoinCondition {
  bytes left_expr = 1;
  string right_key = 2;
}

message LookupJoinOperator {
  ArroyoSchema input_schema = 1;
  ArroyoSchema lookup_schema = 2;
  ConnectorOp connector = 3;
  repeated LookupJoinCondition key_exprs = 4;
  JoinType join_type = 5;
  optional uint64 ttl_micros = 6;
  optional uint64 max_capacity_bytes = 7;
}

message WindowFunctionOperator {
  string name = 1;
  ArroyoSchema input_schema = 2;
  bytes binning_function = 3;
  bytes window_function_plan = 4;
}

enum AsyncUdfOrdering {
  UNORDERED = 0;
  ORDERED = 1;
}

message AsyncUdfOperator {
  string name = 1;
  DylibUdfConfig udf = 2;
  repeated bytes arg_exprs = 3;
  repeated bytes final_exprs = 4;
  AsyncUdfOrdering ordering = 5;
  uint32 max_concurrency = 6;
  uint64 timeout_micros = 7;
}

message UpdatingAggregateOperator {
  string name = 1;
  ArroyoSchema input_schema = 2;
  ArroyoSchema final_schema = 3;
  bytes aggregate_exec = 5;
  bytes metadata_expr = 6;
  uint64 flush_interval_micros = 7;
  // Zero retains the legacy default of 24 hours unless retain_indefinitely is true.
  uint64 ttl_micros = 8;
  // Only explicit true disables state expiry; absent/false preserves finite TTL behavior.
  optional bool retain_indefinitely = 9;
}

enum StateOpType {
  STATE_GET = 0;
  STATE_PUT = 1;
  STATE_UPSERT = 2;
  STATE_UPDATE = 3;
  STATE_DELETE = 4;
}

message StateOperation {
  string map_name = 1;
  StateOpType op_type = 2;
  bytes key_expr = 3;
  bytes value_expr = 4;
  bytes condition_expr = 5;
  string output_field = 6;
}

message StatefulProcessorOperator {
  string name = 1;
  repeated StateOperation operations = 2;
  repeated string map_names = 3;
  ArroyoSchema input_schema = 4;
  repeated bytes final_exprs = 5;
}

// Retained, caller-schema state access. SQL planning creates these descriptors;
// execution requires a fused serial event owner (STR-41). They are never
// independently scheduled batch operators or per-row database transactions.
message StateTableDefinition {
  string name = 1;
  string table_identity = 2;
  string schema_identity = 3;
  string schema_json = 4;
  repeated uint64 primary_key = 5;
  repeated uint64 partition_key = 6;
  uint32 parallelism = 7;
}

message StateTableFieldValue {
  uint64 field_index = 1;
  bytes expression = 2;
}

message StateTableMutationClause {
  bool matched = 1;
  optional bytes predicate = 2;
  string action = 3;
  repeated StateTableFieldValue values = 4;
}

message StateTableOperator {
  StateTableDefinition table = 1;
  string event_scope_id = 2;
  bool requires_fused_serial_owner = 3;
  optional string captured_result_name = 4;
  ArroyoSchema input_schema = 5;
  ArroyoSchema output_schema = 6;
  string expression_schema_json = 7;
  repeated bytes key_expressions = 8;
  repeated StateTableMutationClause clauses = 9;
  optional string lookup_join_type = 10;
  repeated string ownership_bindings = 11;
}

// A single scheduled owner executes all related accesses for one source event.
// A step's parent is the source event when parent_step is absent. Captures are
// taken immediately after the named step, then emitted only after its bounded
// working chunk commits. The captured structs carry row presence in validity.
message FusedStateTableStep {
  optional uint32 parent_step = 1;
  string kind = 2; // projection, value, or state_access
  bytes operator_config = 3;
  repeated uint32 captures = 4;
  ArroyoSchema output_schema = 5;
}

message FusedStateTableOperator {
  string event_scope_id = 1;
  ArroyoSchema input_schema = 2;
  ArroyoSchema output_schema = 3;
  repeated FusedStateTableStep steps = 4;
  repeated StateTableDefinition tables = 5;
  repeated ArroyoSchema capture_schemas = 6;
}

// Extracts one typed capture from the owner's envelope and drops only rows
// where that capture's struct validity is false.
message StateTableCaptureOperator {
  uint32 capture_index = 1;
  ArroyoSchema input_schema = 2;
  ArroyoSchema output_schema = 3;
}

message WasmUdfs {
  string name = 1;
  repeated WasmFunction wasm_functions = 2;
}

message WasmFunction{
  WasmBehavior behavior = 1;
  string name = 2;
  string key_arg = 3;
  string key_arg_type = 4;
  string value_arg = 5;
  string value_arg_type = 6;
  string return_type = 7;
  string body = 8;
}

enum WasmBehavior {
  MAP = 0;
  OPT_MAP = 1;
  FILTER = 2;
  TIMESTAMP = 3;
  KEY_BY = 4;
}

message Window {
  oneof window {
    SlidingWindow sliding_window = 2;
    TumblingWindow tumbling_window = 3;
    InstantWindow instant_window = 4;
    SessionWindow session_window = 5;
  }
}

message SlidingWindow {
  uint64 size_micros = 1;
  uint64 slide_micros = 2;

}
message TumblingWindow {
  uint64 size_micros = 1;
}
message InstantWindow {}

message SessionWindow {
  uint64 gap_micros = 1;
}

message ExpressionWatermarkConfig {
  uint64 period_micros = 1;
  optional uint64 idle_time_micros = 2;
  ArroyoSchema input_schema = 3;
  bytes expression = 4;
}

enum JoinType {
  INNER = 0;
  LEFT = 1;
  RIGHT = 2;
  FULL = 3;
}

enum OffsetMode {
  EARLIEST = 0;
  LATEST = 1;
}

enum EdgeType {
  UNUSED = 0;
  FORWARD = 1;
  SHUFFLE = 2;
  LEFT_JOIN = 3;
  RIGHT_JOIN = 4;
}

// Physical extension nodes
message MemExecNode {
  string table_name = 1;
  // json-encoded
  string schema = 2;
}

message UnnestExecNode {
  // json-encoded
  string schema = 1;
}

message DebeziumDecodeNode {
  // json-encoded
  string schema = 1;
  repeated uint64 primary_keys = 2;
}

message DebeziumEncodeNode {
  // json-encoded
  string schema = 1;
}

message ArroyoExecNode {
  oneof node {
    MemExecNode mem_exec = 1;
    UnnestExecNode unnest_exec = 2;
    DebeziumDecodeNode debezium_decode = 3;
    DebeziumEncodeNode debezium_encode = 4;
  }
}


// Checkpoints

enum TaskCheckpointEventType {
  ALIGNMENT_STARTED = 0;
  CHECKPOINT_STARTED = 1;
  CHECKPOINT_OPERATOR_SETUP_FINISHED = 2;
  CHECKPOINT_SYNC_FINISHED = 3;
  CHECKPOINT_PRE_COMMIT = 4;
}

message TaskCheckpointEvent {
  uint64 time = 1;
  TaskCheckpointEventType event_type = 2;
}

message TaskCheckpointDetail {
  uint32 subtask_index = 1;
  uint64 start_time = 2;
  optional uint64 finish_time = 3;
  optional uint64 bytes = 4;
  repeated TaskCheckpointEvent events = 5;
}

message OperatorCheckpointDetail {
  string operator_id = 1;
  uint64 start_time = 2;
  optional uint64 finish_time = 3;
  bool has_state = 4;
  optional uint64 started_metadata_write = 6;
  map<uint32, TaskCheckpointDetail> tasks = 5;
}


message DylibUdfConfig {
  string dylib_path = 1;
  repeated bytes arg_types = 2;
  bytes return_type = 3;
  bool aggregate = 4;
  bool is_async = 5;
}

message PythonUdfConfig {
  string name = 1;
  repeated bytes arg_types = 2;
  bytes return_type = 3;
  string definition = 4;
}

message ArrowProgramConfig {
  map<string, DylibUdfConfig> udf_dylibs = 1;
  map<string, PythonUdfConfig> python_udfs = 2; 
}

// Arrow
message ArrowProgram {
  repeated ArrowNode nodes = 1;
  repeated ArrowEdge edges = 2;
  ArrowProgramConfig program_config = 3;
}

message ArroyoSchema {
  // json-encoded
  string arrow_schema = 1;
  uint32 timestamp_index = 2;
  repeated uint32 key_indices = 3;
  bool has_keys = 4;
  repeated uint32 routing_key_indices = 5;
  bool has_routing_keys = 6;
}

message ChainedOperator {
  string operator_id = 1;
  string operator_name = 2;
  bytes operator_config = 3; 
}

message ArrowNode {
  int32 node_index = 1;
  uint32 node_id = 2;
  uint32 parallelism = 3;
  string description = 4;
  repeated ChainedOperator operators = 5;
  repeated ArroyoSchema edges = 6;
}

message ArrowEdge {
  int32 source = 1;
  int32 target = 2;
  ArroyoSchema schema = 4;
  EdgeType edge_type = 5;
}
