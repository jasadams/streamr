[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# UDF validation and pipeline creation each compile dependencies on a cold runner.
# Other integration tests retain the default two-minute bound.
[[profile.default.overrides]]
filter = 'package(integ) & test(udfs)'
slow-timeout = { period = "60s", terminate-after = 10 }
