[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(=integ) & test(=udfs)'
# Cold UDF validation and compilation use a separate Cargo project. Leave room
# for the bounded 600s compile request plus validation and pipeline assertions.
slow-timeout = { period = "60s", terminate-after = 12 }
