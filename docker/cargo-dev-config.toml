[build]
rustc-wrapper = "/usr/local/bin/streamr-rustc-cache"
jobs = 4

# Reuse compilation work within edited workspace crates. Unchanged dependencies
# remain eligible for sccache; incremental rustc invocations fall back to rustc.
[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.test]
incremental = true
debug = "line-tables-only"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
