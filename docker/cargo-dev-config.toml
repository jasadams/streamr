[build]
rustc-wrapper = "/usr/local/bin/streamr-rustc-cache"
jobs = 4

# Disable incremental compilation so Rust compilations are eligible for sccache.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.test]
incremental = false
debug = "line-tables-only"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
