[package]
autobenches = false
name = "datafusion-functions-nested"
description = "Nested Type Function packages for the DataFusion query engine"
keywords = ["datafusion", "logical", "plan", "expressions"]
readme = "README.md"
version = "48.0.1"
edition = "2021"
homepage = "https://datafusion.apache.org"
repository = "https://github.com/apache/datafusion"
license = "Apache-2.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
rust-version = "1.82.0"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
large_futures = "warn"
used_underscore_binding = "warn"
or_fun_call = "warn"
unnecessary_lazy_evaluations = "warn"
uninlined_format_args = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)", "cfg(tarpaulin_include)"] }
unused_qualifications = "deny"

[lib]
name = "datafusion_functions_nested"

[dependencies]
arrow = { version = "55.1.0", features = ["prettyprint", "chrono-tz"] }
arrow-ord = { version = "55.0.0", default-features = false }
datafusion-common = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo", default-features = false }
datafusion-doc = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo" }
datafusion-execution = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo" }
datafusion-expr = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo" }
datafusion-functions = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo" }
datafusion-functions-aggregate = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo" }
datafusion-macros = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo" }
datafusion-physical-expr-common = { version = "48.0.1", git = "https://github.com/ArroyoSystems/arrow-datafusion", branch = "48.0.1/arroyo", default-features = false }
itertools = { version = "0.14", features = ["use_std"] }
log = "^0.4"
paste = "1.0.14"

[dev-dependencies]
rand = "0.9"
