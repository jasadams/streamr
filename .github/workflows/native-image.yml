name: Publish native Streamr image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jasadams/streamr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Make space for the native release build on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build source-pinned native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: streamr-native
          platforms: linux/amd64
          load: true
          tags: ghcr.io/jasadams/streamr:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            RUST_IMAGE=rust:1.96.0-bookworm@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc
            FEATURES=
            CARGO_BUILD_JOBS=2
          cache-from: type=gha,scope=streamr-native-amd64
          cache-to: type=gha,scope=streamr-native-amd64,mode=max
      - name: Compile and save Rust UDF through the public API
        run: python3 scripts/native-image-smoke.py ghcr.io/jasadams/streamr:sha-${{ github.sha }} --expected-revision '${{ github.sha }}' --evidence native-image-smoke
      - name: Publish tested image
        shell: bash
        run: docker push ghcr.io/jasadams/streamr:sha-${{ github.sha }} | tee native-image-smoke/publish.log
      - name: Preserve source-bound smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-image-${{ github.sha }}
          path: native-image-smoke/
