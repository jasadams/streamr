name: Temporary Podman strace preflight
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Test trace of owned child inside default container
        run: |
          podman run --rm docker.io/library/debian:bookworm-slim sh -c 'apt-get update && apt-get install -y --no-install-recommends strace && strace -f -c true'
